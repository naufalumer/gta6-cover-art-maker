<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vice Cover Studio makes GTA-style multi-panel poster covers from your photos and a caption, exported as a PNG. It runs offline; photos never leave your machine.">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body data-grade="sunset">
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">VI</span>
    <span class="brand-name">Vice Cover Studio</span>
  </div>
  <p class="tagline">Nine panels. One caption. Your Vice City cover.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h2>Photos</h2>
    <label class="file-label">Add your photos
      <input type="file" id="photoInput" accept="image/*" multiple>
    </label>
    <div class="sample-row">
      <button type="button" class="chip" id="sampleBoulevard">Boulevard sample</button>
      <button type="button" class="chip" id="samplePier">Pier sample</button>
    </div>
    <div class="sample-row">
      <button type="button" class="chip" id="loadGrid">Load 3×3 grid</button>
      <button type="button" class="chip" id="fillAll">Fill all panels</button>
    </div>
    <p class="hint">Uploads stay on your machine — nothing is sent anywhere.</p>

    <h2>Layout</h2>
    <div class="layout-row" id="layoutRow"></div>

    <h2 id="panelTitle">Panel 1 — heli</h2>
    <div class="panel-tabs" id="panelTabs"></div>
    <label>Photo in this panel
      <select id="panelPhoto"></select>
    </label>
    <label>Zoom <span id="zoomVal">100%</span>
      <input type="range" id="zoom" min="50" max="300" value="100">
    </label>
    <label class="check">
      <input type="checkbox" id="fitToggle"> Fit whole photo (no crop)
    </label>
    <button type="button" class="chip" id="resetPanel">Reset this panel</button>

    <h2>Words</h2>
    <label>Caption
      <input type="text" id="caption" value="VICE CITY" maxlength="40">
    </label>
    <label>Subtitle
      <input type="text" id="sub" value="Nine panels · One night" maxlength="60">
    </label>
    <label>Colour grade
      <select id="grade"></select>
    </label>
    <label>Export size
      <select id="size"></select>
    </label>
    <button type="button" class="export" id="exportBtn">Export PNG</button>
    <p class="hint" id="exportNote">Your cover exports as a PNG to share.</p>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="coverCanvas" width="1080" height="1080"></canvas>
    <p class="hint" id="sizeNote">1080 × 1080 · 0/9 panels filled</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
